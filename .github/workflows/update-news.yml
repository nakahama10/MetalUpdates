name: Update news
on:
  schedule:
    - cron: "0 16 * * *"    # 00:00 UTC+8 daily (cron is UTC)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-parse.mjs
      - run: node scripts/fetch-news.mjs
      - name: Commit if changed
        run: |
          git config user.name "metal-updates-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || (git commit -m "Update news" && git push)
